<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="transparent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preload" as="image" href="/cover-hero.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <title>Bali Base</title>
    <style>
      .pu-window-header{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-shrink:0;padding:1rem 1.25rem;border-bottom:1px solid #E5E7EB}
      .pu-close{width:2.25rem;height:2.25rem;flex-shrink:0;border:0;border-radius:9999px;background:#fff;color:#6B7280;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background-color 180ms ease,color 180ms ease,transform 180ms ease}
      .pu-close:hover{background:#F9FAFB;color:#374151}
      .pu-close:active{transform:scale(.95)}
      .pu-close svg,.pu-close-icon{width:1.25rem;height:1.25rem}
      .pu-footer{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-shrink:0;padding:1rem;border-top:1px solid #E5E7EB}
      .pu-button-secondary,.pu-button-primary{min-height:2.5rem;border-radius:.75rem;font-size:.75rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.375rem;transition:background-color 180ms ease,border-color 180ms ease,color 180ms ease,opacity 180ms ease,transform 180ms ease}
      .pu-button-secondary{padding:.625rem 1rem;border:1px solid #E5E7EB;background:transparent;color:#374151}
      .pu-button-secondary:hover{background:#F9FAFB}
      .pu-button-primary{padding:.625rem 1.25rem;border:0;background:#FF7A50;color:#fff;box-shadow:0 4px 6px -1px rgb(0 0 0 / 10%),0 2px 4px -2px rgb(0 0 0 / 10%)}
      .pu-button-primary:hover{background:#E05A30}
      .pu-button-secondary:active,.pu-button-primary:active{transform:scale(.95)}
      .pu-button-secondary:disabled,.pu-button-primary:disabled{cursor:not-allowed;opacity:.5;transform:none}
      html.static-cover-visible,html.static-cover-visible body{min-height:100%;margin:0;background:transparent url("/cover-hero.jpg") center 44%/cover no-repeat;overscroll-behavior-y:auto}
      .static-cover{--static-cover-vh:1vh;position:relative;z-index:9999;min-height:120svh;min-height:calc((var(--static-cover-vh) * 100) + max(env(safe-area-inset-top,0px),44px) + max(env(safe-area-inset-bottom,0px),120px));overflow:hidden;background:transparent;color:#fff;text-align:center;font-family:Manrope,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none}
      .static-cover::before{content:"";position:absolute;inset:0;z-index:1;background:rgb(0 0 0 / 55%);pointer-events:none}
      .static-cover::after{content:"";position:absolute;inset:0;z-index:0;background:transparent url("/cover-hero.jpg") center 44%/cover no-repeat;animation:staticCoverScalePan 20s ease-in-out infinite alternate;transform-origin:center 42%;will-change:transform}
      .static-cover__inner{position:fixed;inset:0;z-index:2;box-sizing:border-box;display:flex;min-height:100svh;min-height:calc(var(--static-cover-vh) * 100);width:100%;flex-direction:column;align-items:center;justify-content:center;padding:calc(10svh + env(safe-area-inset-top)) 16px calc(22svh + env(safe-area-inset-bottom));transform:translateY(15px);pointer-events:none}
      .static-cover__badge{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px;border:1px solid rgb(255 255 255 / 20%);border-radius:999px;background:rgb(255 255 255 / 10%);padding:8px 14px;backdrop-filter:blur(12px);animation:staticCoverBounce 3s ease-in-out infinite}
      .static-cover__badge-icon{color:#FF7A50;font-size:16px;line-height:1}
      .static-cover__badge-text{font-size:11px;font-weight:800;line-height:1;text-transform:uppercase;letter-spacing:.08em}
      .static-cover__brand{display:inline-flex;align-items:baseline;max-width:92vw;margin:0 0 8px;font-family:Jost,Manrope,system-ui,sans-serif;font-size:clamp(3.35rem,13vw,6.5rem);font-weight:800;line-height:1;letter-spacing:.08em;text-transform:uppercase;color:#fff;filter:drop-shadow(0 6px 24px rgb(0 0 0 / 35%))}
      .static-cover__logo-a{display:inline-block;width:.74em;height:.72em;background-color:#d47558;transform:translateY(0);-webkit-mask:url("/logo-a.svg") center/contain no-repeat;mask:url("/logo-a.svg") center/contain no-repeat}
      .static-cover__subtitle{max-width:min(38rem,86vw);margin:12px auto 0;color:rgb(236 253 245 / 90%);font-size:16px;font-weight:500;line-height:1.55;text-shadow:0 2px 12px rgb(0 0 0 / 24%)}
      .static-cover__swipe{position:fixed;left:0;right:0;bottom:calc(6svh + env(safe-area-inset-bottom) - 16px);z-index:2;display:flex;justify-content:center;color:rgb(255 255 255 / 90%);transform:translateY(calc(-150% + 30px));pointer-events:none}
      .static-cover__swipe-mark{position:relative;width:44px;height:84px}
      .static-cover__swipe-track{position:absolute;left:50%;bottom:13px;width:1px;height:52px;border-radius:999px;background:linear-gradient(180deg,rgb(255 255 255 / 56%),rgb(255 255 255 / 8%));transform:translateX(-50%) scaleY(.2);transform-origin:bottom;animation:staticCoverSwipeTrack 1.65s cubic-bezier(.33,0,.16,1) infinite}
      .static-cover__swipe-dot{position:absolute;left:50%;bottom:10px;width:14px;height:14px;border-radius:999px;background:rgb(255 255 255 / 78%);box-shadow:0 0 0 1px rgb(255 255 255 / 18%),0 8px 16px rgb(0 0 0 / 12%);transform:translateX(-50%);animation:staticCoverSwipeDot 1.65s cubic-bezier(.33,0,.16,1) infinite}
      .static-cover__swipe-arrow{position:absolute;left:50%;top:12px;width:30px;height:30px;border-top:1px solid rgb(255 255 255 / 58%);border-left:1px solid rgb(255 255 255 / 34%);border-radius:999px 0 0;transform:translateX(-50%);animation:staticCoverSwipeArrow 1.65s ease-in-out infinite}
      .static-cover__swipe-arrow::after{content:"";position:absolute;left:8px;top:8px;width:18px;height:18px;border-top:1px solid rgb(255 255 255 / 40%);border-left:1px solid rgb(255 255 255 / 22%);border-radius:999px 0 0}
      .static-cover--hidden{display:none}
      @keyframes staticCoverScalePan{0%{transform:scale(1.22) translate3d(0,0,0)}50%{transform:scale(1.32) translate3d(-8px,-6px,0)}100%{transform:scale(1.22) translate3d(0,0,0)}}
      @keyframes staticCoverBounce{0%,100%{transform:translateY(-25%);animation-timing-function:cubic-bezier(.8,0,1,1)}50%{transform:none;animation-timing-function:cubic-bezier(0,0,.2,1)}}
      @keyframes staticCoverSwipeDot{0%,100%{opacity:0;transform:translateX(-50%) translateY(0) scale(.76)}16%{opacity:.86;transform:translateX(-50%) translateY(0) scale(1)}70%{opacity:.74;transform:translateX(-50%) translateY(-48px) scale(.92)}86%{opacity:0;transform:translateX(-50%) translateY(-54px) scale(.74)}}
      @keyframes staticCoverSwipeTrack{0%,12%{opacity:0;transform:translateX(-50%) scaleY(.14)}36%{opacity:.72;transform:translateX(-50%) scaleY(1)}78%,100%{opacity:0;transform:translateX(-50%) scaleY(.18)}}
      @keyframes staticCoverSwipeArrow{0%,100%{opacity:.18;transform:translateX(-50%) translateY(5px) scale(.9) rotate(45deg)}46%,72%{opacity:.76;transform:translateX(-50%) translateY(-1px) scale(1) rotate(45deg)}}
      @media (min-width:641px){.static-cover{display:none}}
    </style>
  </head>
  <body>
    <section id="static-cover" class="static-cover" aria-label="Bali Base">
      <div class="static-cover__inner">
        <div>
          <div class="static-cover__badge">
            <span class="static-cover__badge-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"></path>
                <circle cx="12" cy="12" r="10"></circle>
              </svg>
            </span>
            <span class="static-cover__badge-text" data-static-i18n="cover.badge">Everything in one place</span>
          </div>
          <h1 class="static-cover__brand" aria-label="Bali Base" data-static-brand="true">BALI B<span class="static-cover__logo-a" aria-hidden="true"></span>SE</h1>
          <p class="static-cover__subtitle" data-static-i18n="cover.subtitle">Everything you need in Bali directly from owners at honest prices with no aggregator fees</p>
        </div>
      </div>
      <div class="static-cover__swipe" aria-hidden="true">
        <div class="static-cover__swipe-mark">
          <span class="static-cover__swipe-arrow"></span>
          <span class="static-cover__swipe-track"></span>
          <span class="static-cover__swipe-dot"></span>
        </div>
      </div>
    </section>
    <div id="root"></div>
    <script>
      (() => {
        const cover = document.getElementById('static-cover');
        const isRootRoute = window.location.pathname.replace(/\/+$/, '') === '';
        const isMobile = window.matchMedia('(max-width: 640px)').matches;
        const isCreateWizardDeepLink = new URLSearchParams(window.location.search).get('create') === '1';
        const staticTranslations = {
          EN: {
            'brand.name': 'Bali Base',
            'cover.badge': 'Everything in one place',
            'cover.subtitle': 'Everything you need in Bali directly from owners at honest prices with no aggregator fees'
          },
          RU: {
            'brand.name': 'Bali Base',
            'cover.badge': 'Все в одном месте',
            'cover.subtitle': 'Все необходимое на Бали напрямую от владельцев по честной цене без комиссий агрегаторов'
          },
          ID: {
            'brand.name': 'Bali Base',
            'cover.badge': 'Semuanya di satu tempat',
            'cover.subtitle': 'Semua kebutuhan Anda di Bali langsung dari pemilik dengan harga jujur tanpa biaya agregator'
          },
          FR: {
            'brand.name': 'Bali Base',
            'cover.badge': 'Tout au même endroit',
            'cover.subtitle': 'Tout ce dont vous avez besoin à Bali directement auprès des propriétaires, au juste prix et sans frais d’agrégateur'
          },
          DE: {
            'brand.name': 'Bali Base',
            'cover.badge': 'Alles an einem Ort',
            'cover.subtitle': 'Alles, was Sie auf Bali brauchen, direkt von Eigentümern zu fairen Preisen ohne Aggregatorgebühren'
          }
        };
        const getStaticLanguage = () => {
          const savedLanguage = window.localStorage.getItem('bali_base_language');
          if (savedLanguage && staticTranslations[savedLanguage]) return savedLanguage;
          const deviceLanguages = navigator.languages?.length ? navigator.languages : [navigator.language];
          const languageMap = { en: 'EN', id: 'ID', in: 'ID', ru: 'RU', fr: 'FR', de: 'DE' };
          for (const locale of deviceLanguages) {
            const baseLanguage = locale?.split('-')[0]?.toLowerCase();
            if (baseLanguage && languageMap[baseLanguage]) return languageMap[baseLanguage];
          }
          return 'EN';
        };
        const renderStaticBrand = (label) => {
          const displayLabel = label.toLocaleUpperCase('en-US');
          const baseStartIndex = displayLabel.toLocaleLowerCase('en-US').indexOf('base');
          if (baseStartIndex < 0) return displayLabel;
          const beforeLogo = displayLabel.slice(0, baseStartIndex + 1);
          const afterLogo = displayLabel.slice(baseStartIndex + 2);
          return `${beforeLogo}<span class="static-cover__logo-a" aria-hidden="true"></span>${afterLogo}`;
        };
        const applyStaticLanguage = () => {
          const language = getStaticLanguage();
          const dictionary = staticTranslations[language] || staticTranslations.EN;
          document.documentElement.lang = language.toLowerCase();
          cover?.querySelectorAll('[data-static-i18n]').forEach(element => {
            const key = element.getAttribute('data-static-i18n');
            if (key && dictionary[key]) element.textContent = dictionary[key];
          });
          const brand = cover?.querySelector('[data-static-brand]');
          if (brand) {
            brand.setAttribute('aria-label', dictionary['brand.name']);
            brand.innerHTML = renderStaticBrand(dictionary['brand.name']);
          }
        };
        window.sessionStorage.removeItem('bali_base_static_cover_done');
        window.sessionStorage.removeItem('bali_base_skip_static_cover_once');
        applyStaticLanguage();
        const resetScroll = () => {
          window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
          if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
        };

        if (!cover || !isRootRoute || !isMobile || isCreateWizardDeepLink) {
          cover?.remove();
          resetScroll();
          window.requestAnimationFrame(resetScroll);
          window.setTimeout(resetScroll, 80);
          return;
        }

        document.documentElement.classList.add('static-cover-visible');
        const setStaticCoverHeight = () => {
          document.documentElement.style.setProperty('--static-cover-vh', `${window.innerHeight * 0.01}px`);
        };
        const primeSafariBars = () => {
          window.scrollTo({ top: 66, left: 0, behavior: 'auto' });
        };
        let isClosingStaticCover = false;
        const closeStaticCover = () => {
          if (isClosingStaticCover) return;
          isClosingStaticCover = true;
          if ('scrollRestoration' in window.history) {
            window.history.scrollRestoration = 'manual';
          }
          resetScroll();
          window.requestAnimationFrame(() => {
            resetScroll();
            window.requestAnimationFrame(() => {
              resetScroll();
              window.dispatchEvent(new CustomEvent('bali-base-static-cover-dismiss'));
              cover.remove();
              document.documentElement.classList.remove('static-cover-visible');
              document.documentElement.style.removeProperty('--static-cover-vh');
              resetScroll();
            });
          });
          [80, 160, 320, 640, 1000].forEach(delay => window.setTimeout(resetScroll, delay));
        };

        let touchStartY = 0;
        setStaticCoverHeight();
        window.requestAnimationFrame(() => window.setTimeout(primeSafariBars, 120));
        window.addEventListener('resize', setStaticCoverHeight);
        window.visualViewport?.addEventListener('resize', setStaticCoverHeight);
        cover.addEventListener('wheel', closeStaticCover, { passive: true, once: true });
        cover.addEventListener('mousedown', closeStaticCover, { once: true });
        cover.addEventListener('touchstart', (event) => {
          touchStartY = event.touches[0]?.clientY || 0;
        }, { passive: true });
        cover.addEventListener('touchend', (event) => {
          const touchEndY = event.changedTouches[0]?.clientY || 0;
          if (touchStartY - touchEndY > 40) closeStaticCover();
        }, { passive: true });
      })();
    </script>
    <script>
      (() => {
        const STORAGE_KEY = 'bali_base_admin_tickets';
        const PROBLEM_BUTTON_ATTR = 'data-problem-report-button';
        const PROBLEM_OVERLAY_ID = 'problem-report-overlay';
        const FALLBACK_LISTING_TITLE = 'Listing';
        const FALLBACK_TRANSLATIONS = {
          EN: {
            fallbackListingTitle: 'Listing',
            reportProblem: 'Report a problem',
            problemDescription: 'Problem description',
            cancel: 'Cancel',
            close: 'Close',
            sendMessage: 'Send message',
            tooltip: 'Send a message to the admin panel',
            onlyRegistered: 'Available only to registered users.',
            subject: 'Problem with listing: {title}'
          },
          RU: {
            fallbackListingTitle: 'Объявление',
            reportProblem: 'Сообщить о проблеме',
            problemDescription: 'Описание проблемы',
            cancel: 'Отмена',
            close: 'Закрыть',
            sendMessage: 'Отправить',
            tooltip: 'Отправить сообщение в админпанель',
            onlyRegistered: 'Доступно только зарегистрированным пользователям.',
            subject: 'Проблема с объявлением: {title}'
          },
          ID: {
            fallbackListingTitle: 'Iklan',
            reportProblem: 'Laporkan masalah',
            problemDescription: 'Deskripsi masalah',
            cancel: 'Batal',
            close: 'Tutup',
            sendMessage: 'Kirim pesan',
            tooltip: 'Kirim pesan ke panel admin',
            onlyRegistered: 'Hanya tersedia untuk pengguna terdaftar.',
            subject: 'Masalah dengan iklan: {title}'
          },
          DE: {
            fallbackListingTitle: 'Angebot',
            reportProblem: 'Problem melden',
            problemDescription: 'Problembeschreibung',
            cancel: 'Abbrechen',
            close: 'Schliessen',
            sendMessage: 'Nachricht senden',
            tooltip: 'Nachricht an das Admin-Panel senden',
            onlyRegistered: 'Nur fuer registrierte Nutzer verfuegbar.',
            subject: 'Problem mit Angebot: {title}'
          },
          FR: {
            fallbackListingTitle: 'Annonce',
            reportProblem: 'Signaler un probleme',
            problemDescription: 'Description du probleme',
            cancel: 'Annuler',
            close: 'Fermer',
            sendMessage: 'Envoyer le message',
            tooltip: 'Envoyer un message au panneau admin',
            onlyRegistered: 'Disponible uniquement pour les utilisateurs inscrits.',
            subject: "Probleme avec l'annonce : {title}"
          }
        };
        let lastOpenedListingTitle = '';

        const removeListingContactButtons = () => {
          document.querySelectorAll('button.whatsapp-green').forEach((button) => button.remove());
        };

        const readTickets = () => {
          try {
            const raw = window.localStorage.getItem(STORAGE_KEY);
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            return Array.isArray(parsed) ? parsed : [];
          } catch {
            return [];
          }
        };

        const writeTickets = (tickets) => {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(tickets));
          window.dispatchEvent(new CustomEvent('bali-base-support-tickets-updated', { detail: { tickets } }));
        };

        const normalizeListingTitle = (value) => {
          const normalized = String(value || '').replace(/\s+/g, ' ').trim();
          return normalized && !/^(listing|listings)$/i.test(normalized) ? normalized : '';
        };

        const escapeHtml = (value) => String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');

        const getCurrentLanguage = () => {
          const visibleLanguage = Array.from(document.querySelectorAll('button span'))
            .map((element) => String(element.textContent || '').trim().toUpperCase())
            .find((code) => FALLBACK_TRANSLATIONS[code]);
          if (visibleLanguage) return visibleLanguage;

          const candidates = [
            window.localStorage.getItem('bali_base_language'),
            window.localStorage.getItem('language'),
            window.localStorage.getItem('locale'),
            document.documentElement.lang,
            navigator.language,
            ...(navigator.languages || [])
          ];
          const match = candidates
            .map((value) => String(value || '').slice(0, 2).toUpperCase())
            .find((code) => FALLBACK_TRANSLATIONS[code]);
          return match || 'EN';
        };

        const translate = (key, params = {}) => {
          const dictionary = FALLBACK_TRANSLATIONS[getCurrentLanguage()] || FALLBACK_TRANSLATIONS.EN;
          return String(dictionary[key] || FALLBACK_TRANSLATIONS.EN[key] || key).replace(/\{(\w+)\}/g, (_, paramKey) => params[paramKey] ?? '');
        };

        const parseJson = (value) => {
          try {
            return value ? JSON.parse(value) : null;
          } catch {
            return null;
          }
        };

        const normalizeRegisteredUser = (value) => {
          if (!value || typeof value !== 'object') return null;
          const uid = String(value.uid || value.userId || value.id || '').trim();
          const email = String(value.email || '').trim();
          if (!uid && !email) return null;
          const displayName = String(value.displayName || value.name || value.userName || email || 'Registered user').trim();
          return {
            uid: uid || email,
            displayName,
            email,
            phoneNumber: String(value.phoneNumber || value.phone || '').trim(),
            photoURL: String(value.photoURL || value.avatar || value.userAvatar || '').trim()
          };
        };

        const getRegisteredUser = () => {
          const directKeys = [
            'bali_base_current_user_profile',
            'bali_base_current_user',
            'bali_base_active_user'
          ];
          for (const key of directKeys) {
            const directUser = normalizeRegisteredUser(parseJson(window.localStorage.getItem(key)));
            if (directUser) return directUser;
          }

          for (let index = 0; index < window.localStorage.length; index += 1) {
            const key = window.localStorage.key(index) || '';
            if (!key.startsWith('firebase:authUser:')) continue;
            const firebaseUser = normalizeRegisteredUser(parseJson(window.localStorage.getItem(key)));
            if (firebaseUser) return firebaseUser;
          }

          return null;
        };

        let pendingProblemDialog = false;

        const openAuthPanel = () => {
          pendingProblemDialog = true;
          document.getElementById('users-dropdown-btn-menu')?.click();
          window.setTimeout(() => {
            const signInButton = Array.from(document.querySelectorAll('button'))
              .find((button) => /sign in|войти|masuk|anmelden|connexion/i.test(button.textContent || ''));
            signInButton?.click();
          }, 0);
        };

        const rememberListingTitleFromCard = (target) => {
          const card = target?.closest?.('[id^="card-"]');
          const cardTitle = normalizeListingTitle(card?.querySelector('h3')?.textContent);
          if (cardTitle) {
            lastOpenedListingTitle = cardTitle;
          }
        };

        const getCurrentListingTitle = () => {
          const modal = document.getElementById('details-modal');
          const markedTitle = normalizeListingTitle(modal?.getAttribute('data-listing-title'));
          const visibleTitle = normalizeListingTitle(modal?.querySelector('[data-listing-title]')?.textContent);
          const pageTitle = normalizeListingTitle(document.querySelector('h1')?.textContent);
          return markedTitle || visibleTitle || lastOpenedListingTitle || pageTitle || translate('fallbackListingTitle') || FALLBACK_LISTING_TITLE;
        };

        const closeProblemDialog = () => {
          document.getElementById(PROBLEM_OVERLAY_ID)?.remove();
        };

        const openProblemDialog = () => {
          if (document.getElementById(PROBLEM_OVERLAY_ID)) return;
          if (!getRegisteredUser()) {
            openAuthPanel();
            return;
          }

          const listingTitle = getCurrentListingTitle();
          const safeListingTitle = escapeHtml(listingTitle);
          const overlay = document.createElement('div');
          overlay.id = PROBLEM_OVERLAY_ID;
          overlay.className = 'fixed inset-0 bg-black/55 backdrop-blur-[2px] flex items-center justify-center p-4';
          overlay.style.zIndex = '10000';
          overlay.innerHTML = `
            <div class="pu w-full max-w-lg rounded-[32px] shadow-2xl border border-[#E5E7EB] overflow-hidden">
              <div class="pu-header pu-head pu-window-header">
                <div>
                  <h3>${escapeHtml(translate('reportProblem'))}</h3>
                </div>
                <button
                  type="button"
                  class="pu-close"
                  data-close-problem-dialog="true"
                  aria-label="${escapeHtml(translate('close'))}"
                >
                  <svg class="pu-close-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 6 6 18"></path>
                    <path d="m6 6 12 12"></path>
                  </svg>
                </button>
              </div>

              <form class="pu-body pu-base" data-problem-report-form="true">
                <div class="p-5 space-y-4">
                <div class="text-sm font-bold text-[#1E293B]">${safeListingTitle}</div>

                <label class="block">
                  <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">${escapeHtml(translate('problemDescription'))}</span>
                  <textarea
                    rows="5"
                    required
                    class="mt-2 w-full rounded-2xl border border-[#E5E7EB] bg-[#F8FAFC] px-4 py-3 text-sm text-[#1E293B] placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-[#FF7A50]/20 focus:border-[#FF7A50]/40 resize-none"
                    data-problem-report-text="true"
                  ></textarea>
                </label>

                </div>

                <div class="pu-footer">
                  <button
                    type="button"
                    class="pu-button-secondary"
                    data-cancel-problem-dialog="true"
                  >
                    ${escapeHtml(translate('cancel'))}
                  </button>
                  <button
                    type="submit"
                    class="pu-button-primary"
                  >
                    <span>${escapeHtml(translate('sendMessage'))}</span>
                  </button>
                </div>
              </form>
            </div>
          `;

          overlay.addEventListener('click', (event) => {
            if (event.target === overlay) {
              closeProblemDialog();
            }
          });

          overlay.querySelector('[data-close-problem-dialog="true"]')?.addEventListener('click', closeProblemDialog);
          overlay.querySelector('[data-cancel-problem-dialog="true"]')?.addEventListener('click', closeProblemDialog);
          overlay.querySelector('[data-problem-report-form="true"]')?.addEventListener('submit', (event) => {
            event.preventDefault();
            const registeredUser = getRegisteredUser();
            if (!registeredUser) {
              closeProblemDialog();
              openAuthPanel();
              return;
            }
            const textField = overlay.querySelector('[data-problem-report-text="true"]');
            const rawText = textField instanceof HTMLTextAreaElement ? textField.value.trim() : '';
            if (!rawText) return;

            const createdAt = new Date().toISOString();
            const tickets = readTickets();
            tickets.unshift({
              id: `ticket-${Date.now()}`,
              userId: registeredUser.uid,
              userName: registeredUser.displayName,
              userPhone: registeredUser.phoneNumber,
              userAvatar: registeredUser.photoURL,
              subject: translate('subject', { title: listingTitle }),
              status: 'open',
              createdAt,
              listingId: window.location.pathname,
              listingTitle,
              messages: [
                {
                  id: `msg-${Date.now()}`,
                  sender: 'user',
                  text: rawText,
                  timestamp: createdAt
                }
              ]
            });
            writeTickets(tickets);
            closeProblemDialog();
          });

          document.body.appendChild(overlay);
        };

        const renderProblemButtonContent = (button) => {
          const language = getCurrentLanguage();
          if (button.getAttribute('data-problem-report-language') === language) return;
          button.setAttribute('data-problem-report-language', language);
          button.title = translate('tooltip');
          button.innerHTML = `
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 9v4" />
              <path d="M12 17h.01" />
              <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" />
            </svg>
            <span>${escapeHtml(translate('reportProblem'))}</span>
          `;
        };

        const insertProblemButton = () => {
          const bookingButton = document.getElementById('wa-booking-btn');
          if (!bookingButton) return;
          if (document.querySelector('[data-problem-report-native="true"]')) {
            document.querySelectorAll(`[${PROBLEM_BUTTON_ATTR}="true"]`).forEach((button) => button.remove());
            return;
          }
          const wrapper = bookingButton.closest('div.pt-2');
          const buttonContainer = document.getElementById('details-scroll-container') || wrapper?.parentElement;

          const existingButton = document.querySelector(`[${PROBLEM_BUTTON_ATTR}="true"]`);
          if (existingButton instanceof HTMLButtonElement) {
            renderProblemButtonContent(existingButton);
            if (buttonContainer && (existingButton.parentElement !== buttonContainer || existingButton.nextElementSibling)) {
              buttonContainer.appendChild(existingButton);
            }
            return;
          }

          if (!buttonContainer) return;

          const button = document.createElement('button');
          button.type = 'button';
          button.setAttribute(PROBLEM_BUTTON_ATTR, 'true');
          button.className = 'mx-4 mb-4 sm:mx-7 sm:mb-7 w-[calc(100%-2rem)] sm:w-[calc(100%-3.5rem)] lg:w-auto lg:min-w-[180px] lg:ml-auto lg:mr-7 inline-flex items-center justify-center gap-2 px-3 py-2 rounded-2xl text-xs font-normal transition text-gray-400 hover:text-gray-600';
          renderProblemButtonContent(button);
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            openProblemDialog();
          });

          buttonContainer.appendChild(button);
        };

        document.addEventListener('click', (event) => {
          rememberListingTitleFromCard(event.target);
        }, true);

        const syncButtons = () => {
          removeListingContactButtons();
          insertProblemButton();
          if (pendingProblemDialog && getRegisteredUser()) {
            pendingProblemDialog = false;
            openProblemDialog();
          }
        };

        const syncLanguage = () => {
          closeProblemDialog();
          document.querySelectorAll(`[${PROBLEM_BUTTON_ATTR}="true"]`).forEach((button) => {
            button.removeAttribute('data-problem-report-language');
          });
          syncButtons();
        };

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', syncButtons, { once: true });
        } else {
          syncButtons();
        }

        const observer = new MutationObserver(syncButtons);
        observer.observe(document.body, { childList: true, subtree: true });
        window.addEventListener('bali-base-language-updated', syncLanguage);
        window.addEventListener('storage', (event) => {
          if (event.key === 'bali_base_language') syncLanguage();
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
